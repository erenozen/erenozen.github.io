<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Programming Blog Finder</title>
        <meta
            name="description"
            content="Search 460k posts from thousands of programming blogs, discovered from 20 years of Hacker News."
        />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' x='10' font-size='80'>🔍</text></svg>"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="app.css" />
    </head>
    <body>
        <header class="finder-hero">
            <div class="hero-row">
                <h1><span class="terminal-prefix">></span> Blog Finder</h1>
                <a class="back-link" href="/">← erenozen.dev</a>
            </div>
            <p class="tagline" id="tagline">
                Loading index&hellip;
            </p>
        </header>

        <main class="finder">
            <div class="search-wrap">
                <input
                    id="q"
                    type="search"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="Search posts — try &ldquo;sqlite internals&rdquo;, &ldquo;how dns works&rdquo;&hellip;"
                    aria-label="Search posts and blogs"
                    disabled
                />
                <div class="mode-switch" role="tablist" aria-label="Search mode">
                    <button role="tab" data-mode="posts" class="active">Posts</button>
                    <button role="tab" data-mode="blogs">Blogs</button>
                </div>
            </div>

            <div class="filters">
                <div class="filter-row" id="topics" aria-label="Filter by topic"></div>
                <div class="filter-row secondary">
                    <span class="sort-label">Sort</span>
                    <div class="sort-switch" role="group" aria-label="Sort order">
                        <button data-sort="relevance" class="active">Best</button>
                        <button data-sort="points">Most upvoted</button>
                        <button data-sort="date">Newest</button>
                        <button data-sort="oldest">Oldest</button>
                    </div>
                    <span class="sep">·</span>
                    <label class="toggle">
                        <input type="checkbox" id="hide-news" checked />
                        <span>Hide newsrooms &amp; vendor posts</span>
                    </label>
                    <span class="sep">·</span>
                    <div class="filter-row inline" id="kinds"></div>
                    <span class="spacer"></span>
                    <button id="reset" class="reset" hidden>clear filters</button>
                </div>
            </div>

            <div class="status" id="status" aria-live="polite"></div>
            <ol class="results" id="results"></ol>
            <div class="more-wrap">
                <button id="more" class="more" hidden>Show more</button>
            </div>
        </main>

        <footer class="finder-footer">
            <p>
                Blogs discovered by grouping
                <span id="stat-stories">—</span> Hacker News stories (2006–today,
                ≥25 points) by publisher, then classified. Ranking uses median HN
                score, not total volume — which is what separates a blog from a
                newsroom.
            </p>
            <p class="muted">
                <span id="stat-built">—</span> ·
                <a href="/">portfolio</a> ·
                <a
                    href="https://github.com/erenozen/erenozen.github.io"
                    target="_blank"
                    rel="noopener noreferrer"
                    >source</a
                >
            </p>
        </footer>

        <script defer src="app.js"></script>
    </body>
</html>
